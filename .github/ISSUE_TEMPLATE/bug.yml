name: 🐞 Bug
description: Signaler un problème dans K-Gantt
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Que se passe-t-il ?
      description: Décrivez le problème et ce que vous attendiez.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir le projet d'exemple
        2. Cliquer sur…
        3. Constater que…
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navigateur et système
      placeholder: ex. Firefox 131 sous Windows 11
  - type: textarea
    id: file
    attributes:
      label: Fichier d'exemple (facultatif)
      description: Joignez un fichier .kgantt.json ou .gan qui reproduit le problème, sans données personnelles.
